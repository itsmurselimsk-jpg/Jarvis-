name: Build and Publish Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "=== Java Environment Verification ==="
          java -version
          echo "JAVA_HOME is: ${JAVA_HOME}"
          
          if [ -z "${JAVA_HOME}" ]; then
            echo "ERROR: JAVA_HOME is not set."
            exit 1
          fi

          JAVA_VER_OUTPUT=$(java -version 2>&1 | head -n 1)
          echo "Version output: ${JAVA_VER_OUTPUT}"

          MAJOR_VER=$(echo "${JAVA_VER_OUTPUT}" | sed -E 's/.*version "([0-9]+).*/\1/')
          echo "Detected Java Major Version: ${MAJOR_VER}"

          if ! [[ "${MAJOR_VER}" =~ ^[0-9]+$ ]]; then
            echo "ERROR: Could not detect active Java major version."
            exit 1
          fi

          if [ "${MAJOR_VER}" -lt 17 ]; then
            echo "ERROR: Java major version must be 17 or newer, detected ${MAJOR_VER}."
            exit 1
          fi

          echo "SUCCESS: Java version ${MAJOR_VER} meets requirements (>= 17)."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          echo "=== Temporary Debug Keystore Check ==="
          if [ -f "./debug.keystore" ]; then
            echo "debug.keystore already exists."
          else
            echo "Generating temporary debug keystore..."
            "${JAVA_HOME}/bin/keytool" -genkey -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi

          if [ ! -f "./debug.keystore" ]; then
            echo "ERROR: Failed to create ./debug.keystore."
            exit 1
          fi
          echo "SUCCESS: ./debug.keystore confirmed present."

      - name: Build Debug APK
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify Debug APK
        run: |
          EXPECTED_PATH="app/build/outputs/apk/debug/app-debug.apk"
          echo "Checking expected APK location: ${EXPECTED_PATH}"

          if [ -f "${EXPECTED_PATH}" ] && [ -s "${EXPECTED_PATH}" ] && [[ "${EXPECTED_PATH}" == *.apk ]]; then
            echo "SUCCESS: APK verified at ${EXPECTED_PATH}"
            ls -lh "${EXPECTED_PATH}"
          else
            echo "ERROR: Expected APK not found or invalid at ${EXPECTED_PATH}."
            echo "Searching only inside app/build/outputs/apk:"
            find app/build/outputs/apk -name "*.apk" || true
            exit 1
          fi

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          TEMP_DIR=$(mktemp -d)
          REPO_RAW="${{ github.event.repository.name }}"
          if [ -z "${REPO_RAW}" ]; then
            REPO_RAW=$(basename "${{ github.repository }}")
          fi
          REPO_SAFE=$(echo "${REPO_RAW}" | tr -c '[:alnum:]_.-' '-')
          ASSET_NAME="${REPO_SAFE}-debug-build-${{ github.run_number }}.apk"
          ASSET_PATH="${TEMP_DIR}/${ASSET_NAME}"

          echo "Copying APK to ${ASSET_PATH}..."
          cp "app/build/outputs/apk/debug/app-debug.apk" "${ASSET_PATH}"

          if [ ! -f "${ASSET_PATH}" ] || [ ! -s "${ASSET_PATH}" ] || [[ "${ASSET_PATH}" != *.apk ]]; then
            echo "ERROR: Release asset preparation failed at ${ASSET_PATH}."
            exit 1
          fi

          echo "Prepared asset: ${ASSET_PATH} ($(stat -c%s "${ASSET_PATH}") bytes)"
          echo "asset_path=${ASSET_PATH}" >> "$GITHUB_OUTPUT"
          echo "asset_name=${ASSET_NAME}" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: create_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== GitHub CLI & Asset Verification ==="
          gh --version

          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"

          if [ ! -f "${ASSET_PATH}" ] || [ ! -s "${ASSET_PATH}" ] || [[ "${ASSET_PATH}" != *.apk ]]; then
            echo "ERROR: Prepared release asset validation failed prior to release creation."
            exit 1
          fi

          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"

          echo "Constructed Tag: ${RELEASE_TAG}"
          echo "Constructed Title: ${RELEASE_TITLE}"

          RELEASE_NOTES=$(cat <<EOF
          This is an automatically generated debug APK built by GitHub Actions.

          - Run Number: ${{ github.run_number }}
          - Run Attempt: ${{ github.run_attempt }}
          - Source Commit: ${{ github.sha }}
          - Purpose: Testing and verification
          - Notice: This is NOT a Play Store production release. Signed only with a temporary debug keystore.
          EOF
          )

          gh release create "${RELEASE_TAG}" "${ASSET_PATH}" \
            --target "${{ github.sha }}" \
            --title "${RELEASE_TITLE}" \
            --notes "${RELEASE_NOTES}" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_OUTCOME="${{ steps.create_release.outcome }}"

          echo "=== Release Outcome: ${RELEASE_OUTCOME} ==="

          if [ "${RELEASE_OUTCOME}" = "success" ]; then
            echo "SUCCESS: GitHub Release published successfully."
            gh release view "${RELEASE_TAG}" || true
            
            REPO_URL="${{ github.server_url }}/${{ github.repository }}"
            RELEASE_URL="${REPO_URL}/releases/tag/${RELEASE_TAG}"
            ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"

            echo "Release Tag: ${RELEASE_TAG}"
            echo "Release Title: Debug APK Build #${{ github.run_number }}"
            echo "Direct Release URL: ${RELEASE_URL}"
            echo "APK Asset Name: ${ASSET_NAME}"

            echo "### 🚀 Debug APK Build & Release Succeeded" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Release Page**: [${RELEASE_TITLE}](${RELEASE_URL})" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Direct Release Tag**: \`${RELEASE_TAG}\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Downloadable APK Asset**: \`${ASSET_NAME}\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Direct Download**: You can download the APK directly from **Assets** on the Release page." >> "$GITHUB_STEP_SUMMARY"
            echo "- **Backup Artifact**: The Actions artifact \`app-debug-apk\` is also available on this workflow run." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "WARNING: GitHub Release creation did not succeed or was skipped."
            echo "NOTICE: The APK build succeeded and the Actions artifact 'app-debug-apk' remains available for download."

            echo "### ⚠️ Debug APK Build Notice" >> "$GITHUB_STEP_SUMMARY"
            echo "- **APK Build Status**: Succeeded" >> "$GITHUB_STEP_SUMMARY"
            echo "- **GitHub Release Status**: Release publishing was not completed or permission was restricted." >> "$GITHUB_STEP_SUMMARY"
            echo "- **Download Instructions**: The generated APK is safely preserved and available under **Artifacts** on this workflow run as \`app-debug-apk\`." >> "$GITHUB_STEP_SUMMARY"
          fi
